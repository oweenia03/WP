<!doctype html>
<html>
  <head>
    <title>2413834 김민서 시간표</title>
    <meta charset="utf-8" />
    
    <style>
      body {
        margin: 8px;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      /*기타 글 영역과 테이블을 가로로 묶음*/
      #grid { display: flex; align-items: center; gap: 70px; } 
      
      /*표 관련 기본 스타일*/
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid black; padding: 8px; text-align: center; }
      thead th { background-color: #f2f2f2; }

      /*a태그(링크) 스타일*/
      a { color: black; text-decoration: none; font-weight: bold; margin-left: 33px; }
    </style>
  </head>

  <body>
    <div id="grid">
      <div>
        <!-- 표 왼쪽 글 영역 -->
        <h1 style="font-size: 50px;">Time Table</h1>
        <p style="font-size:18px; margin-top:-15px;">SMWU+AI+KMS</p>
        <p><a href="https://velog.io/@oweenia03/posts" target="_blank" title="myVelog">+ velog</a></p>
        <p><a href="https://github.com/oweenia03" target="_blank" title="myGithub">+ github</a></p>
      </div>

      <script>
        const rows = 10; // 교시 수 (1~10교시)
        const cols = 6; // 요일 열 수 (교시 칸 + 5일)

        const a = {'딥원응':2, '데베':4, '커뮤영':3, 'SM리더':6}; // key-value값으로 월,수 과목과 해당 교시를 부여함 -> 편리하게 시간표 생성 가능
        const b = {'알입':2, '웹프':4, 'NLP':5}; // 화 목 과목 - 해당 교시
        const c = '운영체제(싸강)'; // 기타 강의

        const a1 = Object.keys(a); // 딕셔너리 a의 key만(월수 과목) 뽑아 리스트로 변환 
        const b1 = Object.keys(b); // 딕셔너리 b의 key만(화목 과목) 뽑아 리스트로 변환

        // SM리더는 수요일만, 금요일은 비움
        const A = { Mon: a1.slice(0,3), Tue: b1, Wed: a1, Thu: b1, Fri: null }; 
        const days = Object.keys(A); // A 만든 뒤 요일 리스트 생성

        // 표 헤더 영역
        document.write('<table border="1">');
        document.write('<thead><tr>');
        document.write('<th></th>'); // 좌상단 빈칸 (교시 헤더 자리)
        for (const d of days) document.write('<th>' + d + '</th>'); // thead에 요일 출력
        document.write('</tr></thead>'); 

        // 표 본문 영역
        document.write('<tbody>');
        for (let i = 1; i <= rows; i++) { // 1교시부터 10교시까지
          document.write('<tr>');
          document.write('<th>' + i + '교시</th>'); // 첫번째 열에 교시 번호 출력

          for (let j = 0; j < days.length; j++) { // 요일을 순회하면서 어떤 딕셔너리 참조할지 결정함
            const day = days[j]; // 현재 열에 해당하는 요일 이름을 가져옴
            let dict = null; 

            if (day === 'Mon' || day === 'Wed') dict = a; // 요일에 따라 참조할 딕셔너리 선택
            else if (day === 'Tue' || day === 'Thu') dict = b;

            // 해당 요일의 과목 리스트
            const list = A[day] || [];
            // 현재 교시에 해당하는 과목만 필터링
            const matches = dict ? list.filter(subj => dict[subj] === i) : [];

            // 수요일 SM리더 6-7교시 병합 처리
            if (day === 'Wed' && matches.includes('SM리더') && i === 6) {
              document.write('<td rowspan="2">SM리더</td>');
              continue; 
            }

            // 7교시 재출력 방지
            if (day === 'Wed' && i === 7) {
              continue;
            }
            document.write('<td>' + (matches.join('<br>')) + '</td>');
          }

          document.write('</tr>');
        }
        document.write('</tbody>');

        // 표 푸터 영역 (싸강)
        document.write('<tfoot>');
        // 가로 6칸을 하나로 합침
        document.write('<tr><td colspan="' + cols + '">' + c + '</td></tr>');
        document.write('</tfoot>');
        
        // 표 끝
        document.write('</table>');
      </script>
    </div>
  </body>
</html>
